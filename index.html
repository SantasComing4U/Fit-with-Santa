<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Fit with Santa">
<meta name="theme-color" content="#0d1117">
<title>Fit with Santa</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230d1117'/%3E%3Ccircle cx='90' cy='90' r='75' fill='%23161f2c'/%3E%3Cpath d='M65 52 L90 35 L115 52 Z' fill='%23dc2626'/%3E%3Cpath d='M68 62 C78 48, 102 48, 112 62' fill='%23f1f5f9'/%3E%3Cellipse cx='90' cy='82' rx='22' ry='20' fill='%23f8fafc'/%3E%3Cpath d='M75 80 Q90 108 105 80 Z' fill='%23f1f5f9'/%3E%3Cpath d='M60 112 Q90 98 120 112 L128 165 L52 165 Z' fill='%23dc2626'/%3E%3Cpath d='M74 112 L106 112 L102 165 L78 165 Z' fill='%23111827'/%3E%3Ccircle cx='90' cy='135' r='8' fill='%23f59e0b'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #0d1117;
  --card: #161f2c;
  --card-border: #243042;
  --card-hover: #1e2a3b;
  --ink: #f8fafc;
  --muted: #94a3b8;
  --accent-green: #10b981;
  --accent-green-dark: #059669;
  --santa-red: #dc2626;
  --santa-gold: #f59e0b;
  --input-bg: #0f172a;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
body { padding-bottom: calc(80px + env(safe-area-inset-bottom)); }

/* Header */
header {
  background: rgba(13, 17, 23, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--card-border);
  padding: calc(12px + env(safe-area-inset-top)) 16px 14px;
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; justify-content: space-between;
}
.brand-group { display: flex; align-items: center; gap: 12px; }
.avatar-anime { width: 44px; height: 44px; border-radius: 50%; background: var(--card); border: 2px solid var(--santa-red); flex-shrink: 0; }
header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.02em; }
header .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }

main { padding: 16px; max-width: 680px; margin: 0 auto; }

/* Dashboard Cards (Gravl Style) */
.stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 16px; }
.stat-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 14px; padding: 12px 14px; }
.stat-card .lbl { font-size: 11px; text-transform: uppercase; color: var(--muted); font-weight: 600; letter-spacing: 0.05em; }
.stat-card .val { font-size: 22px; font-weight: 800; margin: 4px 0 2px; color: var(--ink); font-variant-numeric: tabular-nums; }
.stat-card .sub { font-size: 11px; color: var(--muted); }

.card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-bottom: 16px; }
.card h3 { margin: 0 0 4px; font-size: 18px; font-weight: 700; letter-spacing: -0.01em; }
.muted { color: var(--muted); font-size: 13px; line-height: 1.4; }
.tag-group { display: flex; flex-wrap: wrap; gap: 6px; margin: 12px 0; }
.tag { background: #1e293b; color: #cbd5e1; font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 500; border: 1px solid #334155; }

/* Buttons */
.row { display: flex; gap: 8px; align-items: center; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.wrap { flex-wrap: wrap; }
button {
  font: inherit; cursor: pointer; border-radius: 12px; border: 1px solid var(--card-border);
  background: var(--card-hover); color: var(--ink); padding: 11px 14px; font-size: 14px; font-weight: 600;
  transition: all 0.15s ease;
}
button:active { transform: scale(0.97); opacity: 0.9; }
.btn-primary { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }
.btn-red { background: var(--santa-red); color: #fff; border-color: var(--santa-red); }
.btn-ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn-sm { padding: 8px 12px; font-size: 13px; border-radius: 10px; }
.btn-full { width: 100%; text-align: center; }

.pill { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; padding: 4px 10px; border-radius: 20px; font-weight: 700; }
.p-planned { background: #1e293b; color: #38bdf8; }
.p-done { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
.p-skipped { background: rgba(220, 38, 38, 0.15); color: #f87171; }

/* Exercise Cards */
.ex { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 16px; margin-bottom: 14px; }
.ex.doneall { opacity: 0.6; }
.sechead { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 14px 0 8px; font-weight: 700; }
.setrow { display: grid; grid-template-columns: 70px 1fr 12px 1fr 48px; gap: 8px; align-items: center; margin-bottom: 8px; }
.setrow label { font-size: 12px; color: var(--muted); font-weight: 600; }
.setrow input {
  width: 100%; padding: 10px 4px; border: 1px solid var(--card-border); border-radius: 10px; text-align: center;
  font-size: 17px; font-weight: 700; background: var(--input-bg); color: var(--ink);
}
.setrow input:focus { outline: 2px solid var(--accent-green); border-color: transparent; }
.setrow .x { text-align: center; color: var(--muted); font-size: 13px; }
.chk { border-radius: 10px; padding: 10px 0; font-weight: 800; background: #1e293b; color: var(--muted); border: 1px solid var(--card-border); }
.chk.on { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }
.warm input { background: #1c1917; border-color: #44403c; color: #fde68a; }

.hint { background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.25); color: #fcd34d; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin: 10px 0; }
.pr { background: rgba(220, 38, 38, 0.12); border: 1px solid rgba(220, 38, 38, 0.3); color: #fca5a5; border-radius: 12px; padding: 10px 12px; font-size: 13px; margin: 10px 0; }

/* Rest Timer Dock */
#timer {
  position: fixed; left: 0; right: 0; bottom: calc(64px + env(safe-area-inset-bottom));
  background: #18181b; border-top: 1px solid #27272a; padding: 12px 16px; z-index: 40; display: none; box-shadow: 0 -10px 25px rgba(0,0,0,0.5);
}
#timer.show { display: block; }
#timer .t { font-size: 34px; font-weight: 900; text-align: center; font-variant-numeric: tabular-nums; color: var(--santa-gold); }
#timer button { background: #27272a; color: #fff; border-color: #3f3f46; }
#timer .go { background: var(--accent-green); color: #fff; border-color: var(--accent-green); }

/* Navigation Bar */
nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; background: rgba(13, 17, 23, 0.95);
  backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border-top: 1px solid var(--card-border);
  display: grid; grid-template-columns: repeat(4, 1fr); padding-bottom: env(safe-area-inset-bottom);
}
nav button { border: 0; background: none; border-radius: 0; padding: 10px 0 11px; font-size: 10px; color: var(--muted); font-weight: 600; }
nav button .ic { display: block; font-size: 20px; margin-bottom: 2px; }
nav button.on { color: var(--accent-green); }

/* Modal Sheet */
#modal { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.75); backdrop-filter: blur(4px); z-index: 60; display: none; align-items: flex-end; }
#modal.show { display: flex; }
#modal .sheet { background: var(--card); border-top: 1px solid var(--card-border); width: 100%; border-radius: 20px 20px 0 0; padding: 20px 16px calc(24px + env(safe-area-inset-bottom)); max-height: 85vh; overflow: auto; }
#modal h3 { margin: 0 0 6px; font-size: 19px; }
#modal .opt { width: 100%; text-align: left; margin-top: 10px; padding: 14px; background: var(--card-hover); }
.field { margin-bottom: 12px; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600; text-transform: uppercase; }
.field input, .field select, .field textarea { width: 100%; padding: 12px; border: 1px solid var(--card-border); border-radius: 12px; font-size: 16px; background: var(--input-bg); color: var(--ink); }
hr { border: 0; border-top: 1px solid var(--card-border); margin: 16px 0; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
td, th { text-align: left; padding: 10px 4px; border-bottom: 1px solid var(--card-border); }
th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
</style>
</head>
<body>

<header>
  <div class="brand-group">
    <!-- Option B Anime Santa SVG Avatar -->
    <svg class="avatar-anime" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="48" fill="#161f2c"/>
      <!-- Spiky hair back -->
      <path d="M20 45 L30 25 L45 35 L60 20 L75 35 L85 25 L80 50 Z" fill="#f8fafc"/>
      <!-- Face base -->
      <ellipse cx="50" cy="52" rx="22" ry="24" fill="#fcd34d" opacity="0.3"/>
      <ellipse cx="50" cy="52" rx="20" ry="22" fill="#fed7aa"/>
      <!-- Anime eyes -->
      <polygon points="38,46 46,48 38,50" fill="#0f172a"/>
      <polygon points="62,46 54,48 62,50" fill="#0f172a"/>
      <!-- Short white goatee -->
      <path d="M42 62 Q50 78 58 62 Q50 70 42 62 Z" fill="#f8fafc"/>
      <!-- Option B Red Tank Top -->
      <path d="M25 80 Q50 70 75 80 L82 100 L18 100 Z" fill="#dc2626"/>
      <path d="M40 76 L60 76 L62 100 L38 100 Z" fill="#b91c1c"/>
      <path d="M42 76 L58 76 L50 88 Z" fill="#fed7aa"/>
      <!-- Gold trim -->
      <path d="M26 80 Q50 71 74 80" stroke="#f59e0b" stroke-width="2" fill="none"/>
    </svg>
    <div>
      <h1 id="hTitle">Good day, Lifter</h1>
      <div class="sub" id="hSub">Fit with Santa · All weights in lbs</div>
    </div>
  </div>
</header>

<main id="view"></main>

<!-- Rest Timer -->
<div id="timer">
  <div class="t" id="tDisp">1:45</div>
  <div class="row" style="justify-content:center; margin-top:8px;">
    <button class="btn-sm" onclick="Timer.add(-15)">−15s</button>
    <button class="btn-sm go" id="tToggle" onclick="Timer.toggle()">Pause</button>
    <button class="btn-sm" onclick="Timer.add(15)">+15s</button>
    <button class="btn-sm" onclick="Timer.stop()">Skip rest</button>
  </div>
</div>

<!-- Navigation -->
<nav>
  <button data-t="plan" onclick="go('plan')"><span class="ic">📅</span>Overview</button>
  <button data-t="workout" onclick="go('workout')"><span class="ic">🏋️</span>Workout</button>
  <button data-t="progress" onclick="go('progress')"><span class="ic">📈</span>Progress</button>
  <button data-t="profile" onclick="go('profile')"><span class="ic">⚙️</span>Profile</button>
</nav>

<div id="modal" onclick="if(event.target.id==='modal')closeModal()"><div class="sheet" id="sheet"></div></div>

<script>
/* ===================== EXERCISE LIBRARY ===================== */
const SLOTS = {
chest:[
 {role:'Horizontal Press',sets:3,lo:6,hi:8,rest:105,pool:['Barbell Bench Press','Dumbbell Bench Press','Smith Machine Bench Press']},
 {role:'Incline Press',sets:3,lo:8,hi:12,rest:105,pool:['Incline Dumbbell Press','Incline Barbell Press','Incline Smith Press']},
 {role:'Machine Press',sets:2,lo:10,hi:12,rest:105,pool:['Machine Chest Press','Seated Hammer Strength Press','Dip (weighted)']},
 {role:'Fly / Stretch',sets:2,lo:12,hi:15,rest:105,pool:['Cable Fly','Pec Deck','Incline Dumbbell Fly']}
],
back:[
 {role:'Horizontal Row',sets:3,lo:6,hi:10,rest:105,pool:['Chest-Supported Row','Barbell Row','T-Bar Row']},
 {role:'Vertical Pull',sets:3,lo:8,hi:12,rest:105,pool:['Neutral-Grip Lat Pulldown','Wide-Grip Lat Pulldown','Pull-Up (weighted)']},
 {role:'Cable Row',sets:2,lo:10,hi:12,rest:105,pool:['Seated Cable Row','Single-Arm Dumbbell Row','Machine Row']},
 {role:'Lat Isolation',sets:2,lo:12,hi:15,rest:105,pool:['Straight-Arm Pulldown','Cable Pullover','Dumbbell Pullover']}
],
legs:[
 {role:'Squat Pattern',sets:3,lo:6,hi:10,rest:105,pool:['Hack Squat','Barbell Back Squat','Leg Press']},
 {role:'Hinge',sets:3,lo:6,hi:10,rest:105,pool:['Romanian Deadlift','Dumbbell RDL','Back Extension (weighted)']},
 {role:'Quad Isolation',sets:2,lo:10,hi:15,rest:105,pool:['Leg Extension','Walking Lunge','Bulgarian Split Squat']},
 {role:'Hamstring Isolation',sets:2,lo:10,hi:15,rest:105,pool:['Seated Leg Curl','Lying Leg Curl','Nordic Curl']},
 {role:'Calves',sets:2,lo:8,hi:15,rest:90,pool:['Standing Calf Raise','Seated Calf Raise','Leg Press Calf Raise']}
],
shoulders:[
 {role:'Overhead Press',sets:2,lo:6,hi:10,rest:105,pool:['Machine Shoulder Press','Seated Dumbbell Press','Standing Barbell Press']},
 {role:'Lateral Raise',sets:3,lo:10,hi:15,rest:105,pool:['Dumbbell Lateral Raise','Machine Lateral Raise','Leaning Cable Lateral']},
 {role:'Lateral Burnout',sets:2,lo:12,hi:20,rest:90,pool:['Cable Lateral Raise','Lateral Raise Drop Set','Plate Front-to-Lateral']},
 {role:'Rear Delt',sets:3,lo:12,hi:20,rest:90,pool:['Reverse Pec Deck','Cable Face Pull','Bent-Over Dumbbell Reverse Fly']}
],
arms:[
 {role:'Barbell Curl',sets:3,lo:8,hi:12,rest:105,pool:['EZ-Bar Curl','Barbell Curl','Machine Preacher Curl']},
 {role:'Stretch Curl',sets:2,lo:10,hi:15,rest:90,pool:['Incline Dumbbell Curl','Bayesian Cable Curl','Preacher Curl']},
 {role:'Brachialis',sets:2,lo:10,hi:15,rest:90,pool:['Hammer Curl','Cable Rope Hammer Curl','Reverse Curl']},
 {role:'Triceps Pressdown',sets:3,lo:8,hi:12,rest:105,pool:['Cable Pressdown','Rope Pressdown','Dip Machine']},
 {role:'Triceps Overhead',sets:2,lo:10,hi:15,rest:90,pool:['Overhead Cable Extension','Skull Crusher','Single-Arm Overhead Extension']}
],
abs:[
 {role:'Weighted Ab',sets:3,lo:10,hi:15,rest:75,pool:['Cable Crunch','Machine Crunch','Weighted Decline Sit-Up']},
 {role:'Lower / Anti-Ext',sets:2,lo:8,hi:15,rest:75,pool:['Hanging Knee Raise','Ab-Wheel Rollout','Hanging Leg Raise']}
]
};

const DAY_TEMPLATE = [
 {dow:1,day:'Monday',   name:'Chest + Abs', groups:['chest','abs'], absCount:1, tags:['Pecs','Triceps','Abs']},
 {dow:2,day:'Tuesday',  name:'Back',        groups:['back'],        absCount:0, tags:['Lats','Upper Back','Biceps']},
 {dow:3,day:'Wednesday',name:'Legs + Abs',  groups:['legs','abs'],  absCount:2, tags:['Quads','Hamstrings','Calves','Abs']},
 {dow:4,day:'Thursday', name:'Shoulders',   groups:['shoulders'],   absCount:0, tags:['Delts','Rear Delts','Traps']},
 {dow:5,day:'Friday',   name:'Arms + Abs',  groups:['arms','abs'],  absCount:2, tags:['Biceps','Triceps','Forearms','Abs']}
];

/* ===================== STATE ===================== */
const KEY='fitwithsanta.v1';
let S;
function defaults(){
  return {
    profile:{name:'',goal:'Build muscle while losing weight',experience:'Experienced (20+ yrs)',
             equipment:'Full gym',minMinutes:50,maxMinutes:75,defaultRest:105,increment:5,rotate:true},
    weekCounter:0, plan:null, active:null, history:[]
  };
}
function load(){ try{S=JSON.parse(localStorage.getItem(KEY))||defaults();}catch(e){S=defaults();}
  const d=defaults(); S.profile=Object.assign(d.profile,S.profile||{});
  S.history=S.history||[]; S.weekCounter=S.weekCounter||0; }
function save(){ try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){alert('Storage full.');} }

/* ===================== HELPERS ===================== */
const uid=()=>Math.random().toString(36).slice(2,10);
function mondayOf(d){const x=new Date(d);const day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x;}
const iso=d=>new Date(d).toISOString().slice(0,10);
function fmt(d){return new Date(d+'T00:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});}
function fmtShort(d){return new Date(d+'T00:00:00').toLocaleDateString(undefined,{month:'numeric',day:'numeric'});}
const todayISO=()=>iso(new Date());
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const e1rm=(lb,reps)=>(+lb)*(1+(+reps)/30);

/* ===================== PLAN ===================== */
function buildExercises(tpl,wk){
  const out=[];
  tpl.groups.forEach(g=>{
    let slots=SLOTS[g];
    if(g==='abs') slots=slots.slice(0,tpl.absCount||1);
    slots.forEach((s,si)=>{
      const idx = S.profile.rotate ? (wk+si)%s.pool.length : 0;
      out.push({id:uid(),name:s.pool[idx],role:s.role,group:g,sets:s.sets,lo:s.lo,hi:s.hi,
                rest:S.profile.defaultRest,pool:s.pool,skipped:false});
    });
  });
  return out;
}
function generateWeek(startDate){
  const mon=mondayOf(startDate||new Date());
  const wk=S.weekCounter||0; S.weekCounter=wk+1;
  return {weekStart:iso(mon),weekIndex:wk,
    days:DAY_TEMPLATE.map(t=>{
      const d=new Date(mon); d.setDate(mon.getDate()+(t.dow-1));
      return {id:uid(),dow:t.dow,day:t.day,name:t.name,date:iso(d),origDate:iso(d),
              tags:t.tags,status:'planned',exercises:buildExercises(t,wk)};
    })};
}
function ensurePlan(){ if(!S.plan){S.plan=generateWeek(new Date());save();} }

function bestsUpTo(exName){
  let bw=0,be=0,rec=null;
  S.history.forEach(w=>(w.entries||[]).forEach(e=>{
    if(e.name!==exName) return;
    (e.sets||[]).forEach(s=>{
      const lb=+s.lb||0, r=+s.reps||0; if(!lb||!r) return;
      if(lb>bw) bw=lb;
      const v=e1rm(lb,r); if(v>be){be=v;rec={lb,reps:r,date:w.date};}
    });
  }));
  return {bestWeight:bw,bestE1rm:be,record:rec};
}
function allPRs(){
  const names=[...new Set(S.history.flatMap(w=>(w.entries||[]).map(e=>e.name)))];
  return names.map(n=>({name:n,...bestsUpTo(n)})).filter(x=>x.bestE1rm>0).sort((a,b)=>b.bestE1rm-a.bestE1rm);
}
function lastPerf(exName){
  for(let i=S.history.length-1;i>=0;i--){
    const e=(S.history[i].entries||[]).find(x=>x.name===exName && (x.sets||[]).some(s=>s.lb));
    if(e) return {date:S.history[i].date,sets:e.sets.filter(s=>s.lb)};
  }
  return null;
}

/* ===================== ROUTER ===================== */
let TAB='plan';
function go(t){TAB=t;render();window.scrollTo(0,0);}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===TAB));
  ({plan:viewPlan,workout:viewWorkout,progress:viewProgress,profile:viewProfile})[TAB]();
}
function head(title,sub){ hTitle.textContent=title; hSub.textContent=sub||''; }

/* ===================== VIEW: OVERVIEW / PLAN ===================== */
function workoutVolume(w){return (w.entries||[]).reduce((n,e)=>n+(e.sets||[]).reduce((m,s)=>m+((+s.lb||0)*(+s.reps||0)),0),0);}
function last7Workouts(){ const c=iso(new Date(Date.now()-6*864e5)); return S.history.filter(w=>w.date>=c); }

function viewPlan(){
  ensurePlan();
  const days=[...S.plan.days].sort((a,b)=>a.date.localeCompare(b.date));
  const done=days.filter(d=>d.status==='done').length;
  const thisWeekVol = days.reduce((sum,d)=>{
    const h=S.history.find(w=>w.date===d.date);
    return sum + (h?workoutVolume(h):0);
  },0);

  head('Good day, Lifter','Week of '+fmt(S.plan.weekStart));

  const nextDay = days.find(d=>d.status==='planned') || days[0];

  view.innerHTML = `
  <!-- Top Stat Cards Grid (Gravl Style) -->
  <div class="stat-grid">
    <div class="stat-card">
      <div class="lbl">This Week</div>
      <div class="val">${done} <span style="font-size:14px;color:var(--muted)">/ 5</span></div>
      <div class="sub">Goal: 5/week</div>
    </div>
    <div class="stat-card">
      <div class="lbl">Volume</div>
      <div class="val">${Math.round(thisWeekVol).toLocaleString()} <span style="font-size:12px;color:var(--muted)">lb</span></div>
      <div class="sub">Working sets</div>
    </div>
    <div class="stat-card">
      <div class="lbl">Nice List</div>
      <div class="val">${S.history.length} <span style="font-size:12px;color:var(--muted)">days</span></div>
      <div class="sub">Streak active</div>
    </div>
  </div>

  <!-- Featured Next Workout Card -->
  <div class="card" style="border-left: 4px solid var(--accent-green);">
    <div class="spread">
      <div class="lbl" style="color:var(--accent-green)">Next Workout</div>
      <span class="pill ${nextDay.status==='done'?'p-done':'p-planned'}">${nextDay.status}</span>
    </div>
    <h3 style="font-size:22px; margin-top:4px;">${nextDay.day} · ${nextDay.name}</h3>
    <div class="muted">${fmt(nextDay.date)} · ${nextDay.exercises.length} exercises</div>
    <div class="tag-group">
      ${(nextDay.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}
    </div>
    <div class="row wrap" style="margin-top:16px;">
      <button class="btn-primary" style="flex:2" onclick="startWorkout('${nextDay.id}')">${nextDay.status==='done'?'Train Again':'Start Workout'}</button>
      <button onclick="askPostpone('${nextDay.id}')">Postpone</button>
      <button onclick="askSkip('${nextDay.id}')">Skip</button>
    </div>
  </div>

  <!-- Weekly Schedule List -->
  <div class="card">
    <div class="spread" style="margin-bottom:12px;">
      <h3>Weekly Schedule</h3>
      <button class="btn-sm btn-ghost" onclick="askNewWeek()">Generate New Week</button>
    </div>
    ${days.map(d=>`
      <div style="padding:10px 0; border-bottom:1px solid var(--card-border);">
        <div class="spread">
          <div>
            <strong>${d.day} · ${d.name}</strong>
            <div class="muted" style="font-size:12px">${fmt(d.date)}</div>
          </div>
          <span class="pill ${{planned:'p-planned',done:'p-done',skipped:'p-skipped'}[d.status]}">${d.status}</span>
        </div>
      </div>
    `).join('')}
  </div>`;
}

function askPostpone(id){
  const d=S.plan.days.find(x=>x.id===id);
  openModal(`<h3>Postpone ${d.name}?</h3><div class="muted">Santa will suggest a new day. Nothing changes until you confirm.</div>
    <button class="opt btn-primary" onclick="movePlan('${id}','${iso(new Date(Date.now()+864e5))}')">Move to Tomorrow</button>
    <button class="opt" onclick="setStatus('${id}','skipped')">Skip this week</button>
    <button class="opt btn-ghost" onclick="closeModal()">Cancel</button>`);
}
function movePlan(id,date){const d=S.plan.days.find(x=>x.id===id);d.date=date;d.status='planned';save();closeModal();render();}
function askSkip(id){
  openModal(`<h3>Skip this workout?</h3><div class="muted">Skipping won't break your Nice List streak.</div>
    <button class="opt btn-red" onclick="setStatus('${id}','skipped')">Confirm Skip</button>
    <button class="opt btn-ghost" onclick="closeModal()">Cancel</button>`);
}
function setStatus(id,st){S.plan.days.find(x=>x.id===id).status=st;save();closeModal();render();}
function askNewWeek(){
  openModal(`<h3>Generate New Week?</h3><div class="muted">This creates a fresh split and rotates exercises. Your completed history is safe.</div>
    <button class="opt btn-primary" onclick="S.plan=generateWeek();S.active=null;save();closeModal();render()">Generate</button>
    <button class="opt btn-ghost" onclick="closeModal()">Cancel</button>`);
}

/* ===================== VIEW: WORKOUT ===================== */
function startWorkout(dayId){
  if(S.active && S.active.dayId!==dayId){
    return openModal(`<h3>Workout already in progress</h3><div class="muted">Finish or discard current session first.</div>
      <button class="opt btn-primary" onclick="closeModal();go('workout')">Resume Current</button>
      <button class="opt btn-red" onclick="S.active=null;save();closeModal();startWorkout('${dayId}')">Discard &amp; Start New</button>`);
  }
  if(!S.active){
    const d=S.plan.days.find(x=>x.id===dayId);
    S.active={dayId,startedAt:Date.now(),entries:d.exercises.filter(e=>!e.skipped).map(e=>{
      const p=lastPerf(e.name);
      return {exId:e.id,name:e.name,role:e.role,group:e.group,lo:e.lo,hi:e.hi,rest:e.rest,
        warmups:[{lb:'',reps:'',done:false}],
        sets:Array.from({length:e.sets},(_,i)=>({
          lb:p&&p.sets[i]?p.sets[i].lb:(p?p.sets[p.sets.length-1].lb:''),
          reps:p&&p.sets[i]?p.sets[i].reps:'',done:false}))};
    })};
    save();
  }
  go('workout');
}

function viewWorkout(){
  if(!S.active){
    head('Workout','No session active');
    view.innerHTML=`<div class="card" style="text-align:center; padding:40px 20px;">
      <h3>Ready to Lift?</h3>
      <div class="muted" style="margin-bottom:20px">Select a planned workout from the Overview tab to start logging.</div>
      <button class="btn-primary btn-full" onclick="go('plan')">Go to Overview</button>
    </div>`;
    return;
  }
  const d=S.plan.days.find(x=>x.id===S.active.dayId), A=S.active;
  const total=A.entries.reduce((n,e)=>n+e.sets.length,0);
  const done=A.entries.reduce((n,e)=>n+e.sets.filter(s=>s.done).length,0);
  const mins=Math.floor((Date.now()-A.startedAt)/60000);
  head(d.day.toUpperCase()+' · '+d.name, `${mins} min · ${done}/${total} sets done`);

  view.innerHTML = A.entries.map((e,ei)=>{
    const p=lastPerf(e.name), b=bestsUpTo(e.name);
    const allDone=e.sets.every(s=>s.done);
    return `<div class="ex ${allDone?'doneall':''}">
      <div class="spread">
        <div><h3>${esc(e.name)}</h3>
        <div class="muted">${e.sets.length} working sets · target ${e.lo}–${e.hi} reps</div></div>
      </div>
      <div class="muted" style="margin-top:4px">Previous: ${p?p.sets.map(s=>s.lb+' lb × '+s.reps).join(', '):'No history'}</div>
      ${b.record?`<div class="muted">Best: ${b.record.lb} lb × ${b.record.reps} (est 1RM ${Math.round(b.bestE1rm)} lb)</div>`:''}

      <div class="sechead">Warm-up Sets</div>
      ${e.warmups.map((w,i)=>setRow(ei,i,w,'warm','WU '+(i+1))).join('')}
      <button class="btn-sm btn-ghost" onclick="addRow(${ei},'warm')">+ Add warm-up</button>

      <div class="sechead">Working Sets</div>
      ${e.sets.map((s,i)=>setRow(ei,i,s,'work','Set '+(i+1))).join('')}
      <div class="row" style="margin-top:6px">
        <button class="btn-sm btn-ghost" onclick="addRow(${ei},'work')">+ Add set</button>
        <button class="btn-sm btn-ghost" onclick="copyLast(${ei})">Copy last set</button>
      </div>
      <hr>
      <div class="row wrap">
        <button class="btn-sm" onclick="askSwap(${ei})">Swap exercise</button>
        <button class="btn-sm" onclick="askSkipEx(${ei})">Skip exercise</button>
      </div>
    </div>`;
  }).join('') + `<div class="card">
    <button class="btn-primary btn-full" onclick="askFinish()">Finish Workout</button>
    <button class="btn-full btn-ghost" style="margin-top:8px" onclick="askDiscard()">Discard Workout</button>
  </div>`;
}

function setRow(ei,i,s,kind,label){
  return `<div class="setrow ${kind==='warm'?'warm':''}">
    <label>${label}</label>
    <input inputmode="decimal" placeholder="lb" value="${s.lb}" onchange="upd(${ei},${i},'${kind}','lb',this.value)">
    <span class="x">×</span>
    <input inputmode="numeric" placeholder="reps" value="${s.reps}" onchange="upd(${ei},${i},'${kind}','reps',this.value)">
    <button class="chk ${s.done?'on':''}" onclick="toggleDone(${ei},${i},'${kind}')">✓</button>
  </div>`;
}
const arrOf=(e,k)=>k==='warm'?e.warmups:e.sets;
function upd(ei,i,k,f,v){arrOf(S.active.entries[ei],k)[i][f]=v.trim();save();}
function addRow(ei,k){arrOf(S.active.entries[ei],k).push({lb:'',reps:'',done:false});save();viewWorkout();}
function copyLast(ei){const e=S.active.entries[ei],l=e.sets[e.sets.length-1];
  e.sets.push({lb:l.lb,reps:l.reps,done:false});save();viewWorkout();}
function toggleDone(ei,i,k){
  const row=arrOf(S.active.entries[ei],k)[i];
  row.done=!row.done; save(); viewWorkout();
  if(row.done) Timer.start(k==='warm'?60:S.active.entries[ei].rest);
}
function askSkipEx(ei){
  S.active.entries.splice(ei,1);save();viewWorkout();
}
function askSwap(ei){
  const e=S.active.entries[ei], d=S.plan.days.find(x=>x.id===S.active.dayId);
  const planEx=d.exercises.find(x=>x.id===e.exId), pool=planEx?planEx.pool:[e.name];
  openModal(`<h3>Swap Exercise</h3>`+
    pool.map(n=>`<button class="opt ${n===e.name?'btn-primary':''}" onclick="doSwap(${ei},'${n.replace(/'/g,"\\'")}')">${esc(n)}</button>`).join('')+
    `<button class="opt btn-ghost" onclick="closeModal()">Cancel</button>`);
}
function doSwap(ei,name){
  const e=S.active.entries[ei]; e.name=name;
  save(); closeModal(); viewWorkout();
}
function askFinish(){
  openModal(`<h3>Finish Workout?</h3><div class="muted">All completed working sets will be saved to your progress and volume.</div>
    <button class="opt btn-primary" onclick="finishWorkout()">Save &amp; Complete</button>
    <button class="opt btn-ghost" onclick="closeModal()">Keep Training</button>`);
}
function finishWorkout(){
  const A=S.active, d=S.plan.days.find(x=>x.id===A.dayId);
  S.history.push({id:uid(),date:todayISO(),dayName:d.day,name:d.name,
    minutes:Math.max(1,Math.round((Date.now()-A.startedAt)/60000)),
    entries:A.entries.map(e=>({name:e.name,group:e.group||'',
      warmups:e.warmups.filter(w=>w.done&&w.lb),
      sets:e.sets.filter(s=>s.done&&s.lb)}))});
  d.status='done'; S.active=null; Timer.stop(); save(); closeModal(); go('progress');
}
function askDiscard(){
  openModal(`<h3>Discard Workout?</h3><div class="muted">This session will not be saved.</div>
    <button class="opt btn-red" onclick="S.active=null;Timer.stop();save();closeModal();go('plan')">Discard</button>
    <button class="opt btn-ghost" onclick="closeModal()">Cancel</button>`);
}

/* ===================== TIMER ===================== */
const Timer={
  left:0,iv:null,running:false,
  start(sec){this.left=sec||S.profile.defaultRest;this.running=true;this.paint();
    document.getElementById('timer').classList.add('show');
    clearInterval(this.iv);this.iv=setInterval(()=>{if(!this.running)return;
      this.left--;if(this.left<=0){this.beep();this.stop();}else this.paint();},1000);},
  add(s){if(!this.iv)return;this.left=Math.max(5,this.left+s);this.paint();},
  toggle(){this.running=!this.running;tToggle.textContent=this.running?'Pause':'Resume';},
  stop(){clearInterval(this.iv);this.iv=null;this.running=false;
    document.getElementById('timer').classList.remove('show');},
  paint(){const m=Math.floor(this.left/60),s=this.left%60;tDisp.textContent=m+':'+String(s).padStart(2,'0');},
  beep(){try{const c=new (window.AudioContext||window.webkitAudioContext)();
    const o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);
    o.frequency.value=880;g.gain.setValueAtTime(.001,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.3,c.currentTime+.02);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.5);
    o.start();o.stop(c.currentTime+.5);}catch(e){}}
};

/* ===================== VIEW: PROGRESS & SMART READOUT ===================== */
function viewProgress(){
  const H=S.history, prs=allPRs();
  head('Analytics &amp; Progress',`${H.length} workouts logged`);
  
  const totalVol=H.reduce((n,w)=>n+workoutVolume(w),0);

  view.innerHTML = `
  <div class="stat-grid">
    <div class="stat-card">
      <div class="lbl">Workouts</div>
      <div class="val">${H.length}</div>
      <div class="sub">Total completed</div>
    </div>
    <div class="stat-card">
      <div class="lbl">Total Vol</div>
      <div class="val">${Math.round(totalVol/1000)}k <span style="font-size:12px;color:var(--muted)">lb</span></div>
      <div class="sub">Lifetime load</div>
    </div>
    <div class="stat-card">
      <div class="lbl">Records</div>
      <div class="val" style="color:var(--santa-gold)">${prs.length}</div>
      <div class="sub">PRs set</div>
    </div>
  </div>

  <!-- Smart Readout Card -->
  <div class="card" style="border-top: 3px solid var(--santa-gold);">
    <h3 style="color:var(--santa-gold)">🎅 Santa's Readout</h3>
    <div class="muted" style="margin-top:6px">
      ${H.length < 3 ? 'Log a few more workouts to unlock full progression trends.' : 
        'Your volume trends look consistent. Focus on adding reps to compound presses before increasing overall set count.'}
    </div>
  </div>

  <!-- Personal Records Card -->
  <div class="card">
    <h3>Personal Records</h3>
    <table>
      <tr><th>Exercise</th><th>Best Set</th><th>Est 1RM</th></tr>
      ${prs.length ? prs.slice(0,10).map(p=>`<tr>
        <td><strong>${esc(p.name)}</strong></td>
        <td>${p.record.lb} lb × ${p.record.reps}</td>
        <td>${Math.round(p.bestE1rm)} lb</td>
      </tr>`).join('') : '<tr><td colspan="3" class="muted">No PRs recorded yet.</td></tr>'}
    </table>
  </div>`;
}

/* ===================== VIEW: PROFILE ===================== */
function viewProfile(){
  const p=S.profile;
  head('Settings &amp; Profile','Fit with Santa');
  view.innerHTML=`
  <div class="card">
    <h3>Training Profile</h3>
    <div class="field"><label>Goal</label><input id="f_goal" value="${esc(p.goal)}"></div>
    <div class="field"><label>Equipment</label><input id="f_eq" value="${esc(p.equipment)}"></div>
    <div class="row">
      <div class="field" style="flex:1"><label>Default Rest (s)</label><input id="f_rest" type="number" step="15" value="${p.defaultRest}"></div>
      <div class="field" style="flex:1"><label>Increment (lb)</label><input id="f_inc" type="number" step="2.5" value="${p.increment}"></div>
    </div>
    <button class="btn-primary btn-full" onclick="saveProfile()">Save Settings</button>
  </div>
  <div class="card">
    <h3>Data Management</h3>
    <button class="btn-sm btn-full" style="margin-bottom:8px;" onclick="exportData()">Export JSON Backup</button>
    <button class="btn-sm btn-full" onclick="document.getElementById('imp').click()">Import Backup</button>
    <input id="imp" type="file" accept="application/json" style="display:none" onchange="importData(this)">
  </div>`;
}
function saveProfile(){
  Object.assign(S.profile,{goal:f_goal.value,equipment:f_eq.value,defaultRest:+f_rest.value,increment:+f_inc.value});
  save(); alert('Settings saved.');
}
function exportData(){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download='fit-with-santa-'+todayISO()+'.json'; a.click();
}
function importData(input){
  const f=input.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{try{S=JSON.parse(r.result);save();render();alert('Backup imported successfully.');}catch(e){alert('Invalid file.');}};
  r.readAsText(f);
}

/* ===================== MODAL & BOOT ===================== */
function openModal(html){sheet.innerHTML=html;modal.classList.add('show');}
function closeModal(){modal.classList.remove('show');}
load(); ensurePlan();
if(S.active) TAB='workout';
render();
</script>
